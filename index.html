<h3>Kako ti je ime?</h3>
<input id="vnos" placeholder="Vpiši ime">
<button onclick="pozdravi()">Pozdravi</
button>
<p id="odgovor"></p>
<script>
function pozdravi() {
let ime =
document.getElementById("vnos").value;
document.getElementById("odgovor").innerText
=
"Pozdravljen/-a " + ime + "!";
}
</script>
